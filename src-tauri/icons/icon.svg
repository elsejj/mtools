<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Top-edge subtle glass bevel reflection -->
    <linearGradient id="border-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Project Theme Gradient: Deep Emerald -> Mint Green -> Sky Cyan -->
    <linearGradient id="m-grad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="30%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle 3D Top Sheen Overlay -->
    <linearGradient id="m-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>

    <!-- Dock/Desktop Drop Shadow -->
    <filter id="app-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Ambient Emerald Core Glow -->
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern Dark Squircle Base -->
  <g filter="url(#app-shadow)">
    <rect x="104" y="104" width="816" height="816" rx="184" ry="184" fill="#12151b" />
    <rect x="105" y="105" width="814" height="814" rx="183" ry="183" fill="none" stroke="url(#border-top)" stroke-width="2.5" />
  </g>

  <!-- Central mTools Geometric Monogram -->
  <g filter="url(#m-glow)">
    <!-- Main M Glyph -->
    <path d="M 252 708 
             L 252 334 
             C 252 304 278 282 308 282 
             C 328 282 347 293 358 310 
             L 512 516 
             L 666 310 
             C 677 293 696 282 716 282 
             C 746 282 772 304 772 334 
             L 772 708 
             C 772 732 752 752 728 752 
             C 704 752 684 732 684 708 
             L 684 426 
             L 550 606 
             C 541 618 527 626 512 626 
             C 497 626 483 618 474 606 
             L 340 426 
             L 340 708 
             C 340 732 320 752 296 752 
             C 272 752 252 732 252 708 Z" 
          fill="url(#m-grad)" />

    <!-- Sheen Overlay for tactile precision finish -->
    <path d="M 252 708 
             L 252 334 
             C 252 304 278 282 308 282 
             C 328 282 347 293 358 310 
             L 512 516 
             L 666 310 
             C 677 293 696 282 716 282 
             C 746 282 772 304 772 334 
             L 772 708 
             C 772 732 752 752 728 752 
             C 704 752 684 732 684 708 
             L 684 426 
             L 550 606 
             C 541 618 527 626 512 626 
             C 497 626 483 618 474 606 
             L 340 426 
             L 340 708 
             C 340 732 320 752 296 752 
             C 272 752 252 732 252 708 Z" 
          fill="url(#m-highlight)" />
  </g>
</svg>

